name: Rewrite test baselines

# Runs the functional tests with EF_TEST_REWRITE_BASELINES=1 so EF Core rewrites the expected SQL /
# compiled-model baselines in the test sources with what the provider actually generates, then pushes the
# changes to a new branch "baselines/<run>-<database>" for review (open a PR from it).
#
# Use it after upgrading EF Core: run it for MySQL first, then run it again on the generated branch for
# MariaDB (some baselines are server specific). Always review the diff: a rewritten baseline only means
# "this is the SQL we generate now", not that it is correct.

on:
  workflow_dispatch:
    inputs:
      database:
        description: 'Database server image'
        required: true
        type: choice
        default: mysql:8.4
        options:
          - mysql:8.4
          - mysql:8.0
          - mariadb:11.4
          - mariadb:10.11
      filter:
        description: 'Optional dotnet test --filter (empty = whole functional suite)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  Rewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      db:
        image: ${{ inputs.database }}
        env:
          MYSQL_ROOT_PASSWORD: Password12!
          MARIADB_ROOT_PASSWORD: Password12!
        ports:
          - 3306:3306
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Configure database server
        shell: bash
        env:
          DATABASE: ${{ inputs.database }}
          DB_CONTAINER: ${{ job.services.db.id }}
        run: |
          set -euo pipefail
          if [[ "$DATABASE" == mariadb* ]]; then
            client=mariadb
            sqlMode='STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION'
            echo "maxParallelThreads=1" >> "$GITHUB_ENV"
          else
            client=mysql
            sqlMode='ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION'
            echo "maxParallelThreads=0" >> "$GITHUB_ENV"
          fi
          for i in $(seq 1 60); do
            docker exec "$DB_CONTAINER" "$client" -uroot -pPassword12! -e 'SELECT 1;' >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec "$DB_CONTAINER" "$client" -uroot -pPassword12! \
            -e "SET GLOBAL sql_mode = '$sqlMode'; SET GLOBAL max_connections = 512; SELECT @@version;"
      - name: Build
        shell: bash
        run: |
          cp test/EFCore.MySql.FunctionalTests/config.json.example test/EFCore.MySql.FunctionalTests/config.json
          # Keep real source paths in the PDBs: EF Core locates the AssertSql call to rewrite from the stack trace.
          dotnet build test/EFCore.MySql.FunctionalTests -c Debug \
            -p:ContinuousIntegrationBuild=false -p:DeterministicSourcePaths=false
      - name: Functional tests (rewriting baselines)
        shell: bash
        env:
          EF_TEST_REWRITE_BASELINES: '1'
          FILTER: ${{ inputs.filter }}
        run: |
          filter=()
          [[ -n "$FILTER" ]] && filter=(--filter "$FILTER")
          # Failures are expected here: every mismatching baseline fails once and is rewritten.
          dotnet test test/EFCore.MySql.FunctionalTests -c Debug --no-build "${filter[@]}" \
            --logger "trx;LogFileName=rewrite.trx" --results-directory TestResults \
            -- xUnit.MaxParallelThreads=${{ env.maxParallelThreads }} || true
      - name: Push rewritten baselines
        shell: bash
        env:
          DATABASE: ${{ inputs.database }}
        run: |
          set -euo pipefail
          # Only tracked/untracked source files under test/; ignored files (config.json, bin/, obj/) are skipped.
          # The rewriter writes CRLF; .gitattributes (text=auto) normalizes it to LF on add.
          git -c core.safecrlf=false add -A -- test
          if git diff --cached --quiet; then
            echo "No baseline changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="baselines/${GITHUB_RUN_ID}-${DATABASE//[:.]/-}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "Rewrite test baselines against $DATABASE" -m "Generated by workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID with EF_TEST_REWRITE_BASELINES=1."
          git diff HEAD~1 > baselines.patch
          git push origin "HEAD:refs/heads/$branch"
          {
            echo "### Baselines rewritten against \`$DATABASE\`"
            echo
            echo "Branch: \`$branch\` - [open a pull request]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$GITHUB_REF_NAME...$branch?expand=1)"
            echo
            echo '```'
            git diff --stat HEAD~1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload patch and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rewrite-baselines-${{ github.run_id }}
          path: |
            baselines.patch
            TestResults
          if-no-files-found: ignore
